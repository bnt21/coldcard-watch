name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regression tests
        run: python -m unittest discover -s tests -v

      - name: Headline maths (runs in the browser, so Python cannot reach it)
        run: node tests/test_headline.js

      - name: Leak gate catches what it claims to
        run: python check_clean.py --selftest

      - name: No credential or machine address in the tree
        run: python check_clean.py
